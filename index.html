<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mail DNS Check · SPF / DKIM / DMARC / MX</title>
<script>
  // Applica subito il tema salvato (prima del rendering, evita il flash di colori)
  try {
    const t = localStorage.getItem('maildns-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* storage non disponibile: resta Auto */ }
</script>
<style>
  :root {
    --bg: #0f1419;
    --bg-elev: #1a2028;
    --bg-card: #1e2530;
    --border: #2a3340;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --accent-2: #79c0ff;
    --ok: #3fb950;
    --warn: #d29922;
    --crit: #f85149;
    --info: #6e7681;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  /* Tema: data-theme sull'<html> = "light" | "dark"; assente = Auto (segue il sistema).
     Il tema scuro e' quello base di :root; il chiaro si applica se scelto
     esplicitamente oppure in Auto quando il sistema preferisce il chiaro. */
  :root { color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg: #f6f8fa;
      --bg-elev: #ffffff;
      --bg-card: #ffffff;
      --border: #d0d7de;
      --text: #1f2328;
      --text-dim: #656d76;
      --accent: #0969da;
      --accent-2: #0550ae;
      --ok: #1a7f37;
      --warn: #9a6700;
      --crit: #cf222e;
      --info: #656d76;
    }
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f6f8fa;
    --bg-elev: #ffffff;
    --bg-card: #ffffff;
    --border: #d0d7de;
    --text: #1f2328;
    --text-dim: #656d76;
    --accent: #0969da;
    --accent-2: #0550ae;
    --ok: #1a7f37;
    --warn: #9a6700;
    --crit: #cf222e;
    --info: #656d76;
  }
  * { box-sizing: border-box; min-width: 0; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    font-size: 14px;
  }
  header {
    background: var(--bg-elev);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px;
  }
  header h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header h1::before { content: "📧"; font-size: 22px; }
  header p { margin: 4px 0 0; color: var(--text-dim); font-size: 13px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

  /* Selettore tema Auto / Chiaro / Scuro */
  .theme-switch {
    display: inline-flex; border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden; background: var(--bg);
  }
  .theme-switch button {
    background: none; border: none; color: var(--text-dim);
    padding: 6px 12px; font-size: 13px; cursor: pointer;
    border-right: 1px solid var(--border);
  }
  .theme-switch button:last-child { border-right: none; }
  .theme-switch button:hover { color: var(--text); }
  .theme-switch button[aria-pressed="true"] {
    background: color-mix(in srgb, var(--accent) 18%, transparent);
    color: var(--accent); font-weight: 600;
  }

  /* Footer crediti e licenza */
  .site-footer {
    max-width: 1100px; margin: 8px auto 0; padding: 20px 24px 32px;
    border-top: 1px solid var(--border);
    color: var(--text-dim); font-size: 12.5px; line-height: 1.7;
  }
  .site-footer a { color: var(--accent); text-decoration: none; }
  .site-footer a:hover { text-decoration: underline; }

  main { max-width: 1100px; margin: 0 auto; padding: 24px; }

  .form-card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .form-row { display: grid; grid-template-columns: 1fr 200px; gap: 12px; margin-bottom: 12px; }
  .form-row.single { grid-template-columns: 1fr; }

  /* Separatore "oppure" tra modalità dominio e modalità EML */
  .or-divider {
    display: flex; align-items: center; gap: 12px;
    margin: 16px 0; color: var(--text-dim); font-size: 12px;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .or-divider::before, .or-divider::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }

  /* File EML stilizzato come dropzone coerente col resto */
  .eml-drop {
    position: relative;
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 16px;
    background: var(--bg);
    transition: border-color 0.15s, background 0.15s;
    display: flex; align-items: center; gap: 14px;
  }
  /* Layer cliccabile per "scegli file": copre tutto tranne il bottone Rimuovi */
  .eml-drop .file-input-layer {
    position: absolute; inset: 0;
    cursor: pointer;
    z-index: 1;
  }
  .eml-drop .file-input-layer input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .eml-drop:hover, .eml-drop.dragover { border-color: var(--accent); background: var(--bg-elev); }
  /* I contenuti vanno sopra il layer di input per essere visibili */
  .eml-drop .icon, .eml-drop .text { position: relative; z-index: 2; pointer-events: none; }
  .eml-drop .icon { font-size: 28px; flex-shrink: 0; }
  .eml-drop .text { flex: 1; min-width: 0; }
  .eml-drop .title { font-weight: 600; color: var(--text); font-size: 14px; }
  .eml-drop .desc  { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  .eml-drop .desc code { background: var(--bg-elev); padding: 1px 5px; border-radius: 3px; }
  /* Bottone Rimuovi: sopra il file input, riceve i click */
  .eml-drop .clear-btn {
    position: relative; z-index: 3;
    background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-dim);
    padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;
    flex-shrink: 0;
  }
  .eml-drop .clear-btn:hover { color: var(--crit); border-color: var(--crit); }
  label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  input[type=text], input[type=file], textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
  }
  textarea { min-height: 60px; font-family: var(--mono); font-size: 13px; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .advanced-toggle {
    background: none; border: none; color: var(--accent); cursor: pointer;
    font-size: 13px; padding: 0; margin-bottom: 8px;
  }
  .advanced { display: none; padding-top: 8px; border-top: 1px solid var(--border); margin-top: 12px; }
  .advanced.open { display: block; }
  .actions { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  button.primary, button.secondary {
    color: white; border: none;
    padding: 10px 20px; border-radius: 6px; cursor: pointer;
    font-size: 14px; font-weight: 600;
  }
  button.primary { background: var(--accent); }
  button.primary:hover { background: var(--accent-2); }
  button.primary:disabled { opacity: 0.6; cursor: not-allowed; }
  button.secondary {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.secondary:hover { border-color: var(--accent); color: var(--accent); }
  button.secondary:disabled { opacity: 0.6; cursor: not-allowed; }
  .hint { color: var(--text-dim); font-size: 12px; }

  .overall-banner {
    padding: 14px 18px; border-radius: 10px; margin-bottom: 20px;
    display: flex; align-items: center; gap: 12px; font-weight: 500;
    border: 1px solid var(--border);
  }
  .overall-banner.ok   { background: color-mix(in srgb, var(--ok) 12%, transparent); border-color: var(--ok); }
  .overall-banner.warning { background: color-mix(in srgb, var(--warn) 12%, transparent); border-color: var(--warn); }
  .overall-banner.critical { background: color-mix(in srgb, var(--crit) 12%, transparent); border-color: var(--crit); }
  .overall-banner .icon { font-size: 24px; }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .card-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .card-header h2 {
    margin: 0; font-size: 16px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .card-body { padding: 16px 18px; overflow: hidden; }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 12px;
    font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .badge.ok   { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }
  .badge.warning { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .badge.critical { background: color-mix(in srgb, var(--crit) 20%, transparent); color: var(--crit); }
  .badge.info { background: color-mix(in srgb, var(--info) 20%, transparent); color: var(--text-dim); }
  .badge.unknown { background: color-mix(in srgb, var(--info) 20%, transparent); color: var(--text-dim); }

  /* ---- Card "Analisi EML": evidenziata, colore in base all'esito ---- */
  .eml-card { border-width: 2px; }
  .eml-card.ok       { border-color: var(--ok); }
  .eml-card.info     { border-color: var(--accent); }
  .eml-card.warning  { border-color: var(--warn); }
  .eml-card.critical { border-color: var(--crit); }
  .eml-card .card-header { background: var(--bg-elev); }
  .eml-verdict {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 14px 16px; border-radius: 8px; margin-bottom: 14px;
    border-left: 5px solid;
  }
  .eml-verdict .v-icon { font-size: 26px; line-height: 1; flex-shrink: 0; }
  .eml-verdict .v-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .eml-verdict .v-text { font-size: 13.5px; }
  .eml-verdict.ok       { background: color-mix(in srgb, var(--ok) 14%, transparent);     border-color: var(--ok); }
  .eml-verdict.ok .v-title       { color: var(--ok); }
  .eml-verdict.info     { background: color-mix(in srgb, var(--accent) 14%, transparent); border-color: var(--accent); }
  .eml-verdict.info .v-title     { color: var(--accent); }
  .eml-verdict.warning  { background: color-mix(in srgb, var(--warn) 14%, transparent);   border-color: var(--warn); }
  .eml-verdict.warning .v-title  { color: var(--warn); }
  .eml-verdict.critical { background: color-mix(in srgb, var(--crit) 16%, transparent);   border-color: var(--crit); }
  .eml-verdict.critical .v-title { color: var(--crit); }
  .badge.eml-info { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); }
  .eml-sel-ok   { color: var(--accent) !important; }
  .eml-sel-info { color: var(--accent) !important; }
  .eml-sel-crit { color: var(--crit) !important; }

  .issue-list { margin: 0; padding: 0; list-style: none; }
  .issue {
    padding: 10px 12px;
    border-radius: 6px;
    margin-bottom: 8px;
    border-left: 3px solid;
    background: var(--bg-elev);
    display: flex; gap: 10px; align-items: flex-start;
  }
  .issue.critical { border-left-color: var(--crit); }
  .issue.warning  { border-left-color: var(--warn); }
  .issue.info     { border-left-color: var(--info); }
  .issue-icon { font-size: 16px; line-height: 1.2; flex-shrink: 0; }
  .issue span:last-child { word-wrap: break-word; min-width: 0; }

  .kv { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 6px 14px; margin: 0; }
  .kv dt { color: var(--text-dim); font-size: 13px; }
  .kv dd { margin: 0; font-family: var(--mono); font-size: 13px; word-break: break-all; min-width: 0; }

  .record {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 10px 12px; border-radius: 6px;
    font-family: var(--mono); font-size: 12.5px;
    word-break: break-all;
    overflow-wrap: anywhere;
    margin-bottom: 8px;
  }
  .record .label-inline {
    display: inline-block;
    background: var(--accent);
    color: white;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 3px;
    margin-right: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-family: inherit;
    font-weight: 600;
    vertical-align: middle;
  }

  table.mx-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.mx-table th, table.mx-table td {
    padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left;
  }
  table.mx-table th { color: var(--text-dim); font-weight: 500; font-size: 12px; text-transform: uppercase; }
  table.mx-table td { font-family: var(--mono); word-break: break-all; }

  /* Tag chips: due varianti, short (in grid) e long (full-width con scroll) */
  .tag-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 8px;
    margin-top: 12px;
  }
  .tag-chip {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tag-chip .key { color: var(--text-dim); }
  .tag-chip .val { color: var(--accent-2); }

  /* Tag "lunghi": rua, ruf, p (DKIM) — box dedicato a tutta larghezza con scroll interno */
  .tag-long-list { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .tag-long {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .tag-long-header {
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    color: var(--accent);
    padding: 5px 10px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .tag-long-header .count {
    background: var(--accent);
    color: white;
    padding: 1px 7px;
    border-radius: 10px;
    font-size: 10px;
  }
  .tag-long-body {
    padding: 6px 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 200px;
    overflow-y: auto;
  }
  .tag-long-value {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--accent-2);
    /* break-all gestisce stringhe lunghissime (chiavi DKIM, URI rua/ruf) andando a capo
       invece di forzare lo scroll orizzontale e uscire dal contenitore */
    word-break: break-all;
    overflow-wrap: anywhere;
    padding: 4px 0;
    border-bottom: 1px dashed color-mix(in srgb, var(--border) 60%, transparent);
    line-height: 1.4;
  }
  .tag-long-value:last-child { border-bottom: none; }

  .dkim-selector {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 12px; border-radius: 6px; margin-bottom: 10px;
    overflow: hidden;
  }
  .dkim-selector h4 {
    margin: 0 0 8px; font-size: 14px;
    display: flex; align-items: center; gap: 8px;
    font-family: var(--mono);
    flex-wrap: wrap;
    word-break: break-all;
  }

  .alert-conflict {
    background: color-mix(in srgb, var(--crit) 18%, transparent);
    border: 2px solid var(--crit);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 14px;
    display: flex; gap: 12px; align-items: flex-start;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--crit) 40%, transparent); }
    50%      { box-shadow: 0 0 0 8px transparent; }
  }
  .alert-conflict .icon { font-size: 28px; flex-shrink: 0; }
  .alert-conflict strong { color: var(--crit); }
  .alert-conflict > div { min-width: 0; word-wrap: break-word; }

  .loader {
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%; width: 18px; height: 18px;
    animation: spin 1s linear infinite;
    display: inline-block;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .meta-bar {
    color: var(--text-dim); font-size: 12px;
    margin-bottom: 16px; padding: 8px 12px;
    background: var(--bg-elev); border-radius: 6px;
    display: flex; gap: 18px; flex-wrap: wrap;
  }
  .meta-bar code { font-family: var(--mono); color: var(--text); }

  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--text-dim); font-size: 13px; user-select: none; }
  summary:hover { color: var(--accent); }

  .error-msg {
    background: color-mix(in srgb, var(--crit) 15%, transparent);
    border: 1px solid var(--crit);
    color: var(--crit);
    padding: 12px; border-radius: 6px; margin-bottom: 16px;
  }

  /* PDF download bar */
  .pdf-bar {
    margin-top: 24px;
    padding: 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  /* Nota informativa tecnica (es. spiegazione trailing dot FQDN) */
  .info-note {
    margin-top: 20px;
    padding: 14px 16px;
    background: color-mix(in srgb, var(--accent) 8%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.55;
    display: flex; align-items: flex-start; gap: 12px;
  }
  .info-note .info-note-icon { font-size: 18px; flex-shrink: 0; line-height: 1.3; }
  .info-note strong { color: var(--text); }
  .info-note code {
    font-family: var(--mono); font-size: 12px;
    background: var(--bg); padding: 1px 5px; border-radius: 3px;
    color: var(--accent-2);
  }
  .info-note em { font-style: italic; color: var(--text); }


  @media (max-width: 700px) {
    .form-row { grid-template-columns: 1fr; }
    .kv { grid-template-columns: 1fr; }
    main { padding: 12px; }
  }

  /* Header tools (language + theme switches) */
  .header-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .overall-banner.unknown { background: color-mix(in srgb, var(--info) 12%, transparent); border-color: var(--info); }
  /* Share bar: read-only link + copy button */
  .share-bar input[type=text] { flex: 1 1 260px; font-family: var(--mono); font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Mail DNS Check</h1>
    <p data-i18n="tagline">Check SPF · DKIM · DMARC · MX with a detailed analysis</p>
  </div>
  <div class="header-tools">
    <div class="theme-switch" role="group" data-i18n-aria="lang_label" aria-label="Language">
      <button type="button" data-lang-choice="it" title="Italiano">IT</button>
      <button type="button" data-lang-choice="en" title="English">EN</button>
    </div>
    <div class="theme-switch" role="group" data-i18n-aria="theme_label" aria-label="Theme">
      <button type="button" data-theme-choice="auto" data-i18n="theme_auto" data-i18n-title="theme_auto_title">🖥️ Auto</button>
      <button type="button" data-theme-choice="light" data-i18n="theme_light">☀️ Light</button>
      <button type="button" data-theme-choice="dark" data-i18n="theme_dark">🌙 Dark</button>
    </div>
  </div>
</header>

<main id="main">
  <form id="check-form" class="form-card">
    <div class="form-row">
      <div>
        <label for="domain" data-i18n="lbl_domain">Domain</label>
        <input type="text" id="domain" name="domain" placeholder="example.com" data-i18n-ph="ph_domain" autocomplete="off" autocapitalize="none" spellcheck="false">
      </div>
      <div>
        <label for="resolver" data-i18n="lbl_resolver">DNS resolver</label>
        <input type="text" id="resolver" name="resolver" value="1.1.1.1" autocomplete="off" spellcheck="false">
      </div>
    </div>

    <div class="or-divider" data-i18n="or">or</div>

/**
 * Language: ?lang=it|en in the URL > choice saved in this browser >
 * browser languages (first Italian or English one) > English.
 */
function detectLang() {
  const q = new URLSearchParams(location.search).get('lang');
  if (q === 'it' || q === 'en') return q;
  try {
    const s = localStorage.getItem('maildns-lang');
    if (s === 'it' || s === 'en') return s;
  } catch (e) { /* storage not available */ }
  const langs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
  for (const l of langs) {
    const p = String(l).toLowerCase().slice(0, 2);
    if (p === 'it' || p === 'en') return p;
  }
  return 'en';
}
let LANG = detectLang();

function S(key) {
  const v = I18N[LANG][key];
  return v !== undefined ? v : (I18N.en[key] !== undefined ? I18N.en[key] : key);
}
function fmt(tpl, args) {
  return String(tpl).replace(/\{(\d+)\}/g, (m, i) => (args[i] !== undefined ? String(args[i]) : m));
}
/** Plain-text string (escape it before putting it in HTML). */
function T(key, ...args) { return fmt(S(key), args); }
/** HTML string: the template is escaped, the arguments must already be safe HTML. */
function TH(key, ...htmlArgs) { return fmt(escapeHtml(S(key)), htmlArgs); }
/** Same sentence as plain text (PDF) and HTML (page). Object args: {t: text, h: html}. */
function both(key, ...args) {
  const isObj = (a) => a !== null && typeof a === 'object';
  return {
    text: fmt(S(key), args.map(a => (isObj(a) ? a.t : String(a)))),
    html: fmt(escapeHtml(S(key)), args.map(a => (isObj(a) ? a.h : escapeHtml(String(a))))),
  };
}
function DESC(kind) { return (I18N[LANG].desc || I18N.en.desc)[kind]; }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/** Applies the current language to the static parts of the page. */

let lastReportData = null;
let parsedEmlData = null;     // { file, domain, selectors, dkimSigs, arcSigs, internal }
let autofilledDomain = null;  // domain written in the field by the last EML (not typed by the user)
let running = false;

const DOMAIN_RE   = /^(?=.{1,253}$)([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$/i;
const SELECTOR_RE = /^[A-Za-z0-9][A-Za-z0-9_.\-]{0,62}$/;
const RESOLVER_RE = /^[0-9a-fA-F:.]{2,45}$/;

const sleep = (ms) => new Promise(res => setTimeout(res, ms));

function clearEml() {

  if (autofilledDomain && $('#domain').value.trim().toLowerCase() === autofilledDomain) $('#domain').value = '';
  autofilledDomain = null;

}

/** Draws the EML box for the current state (no file / parsed file) in the current language. */
function renderEmlBox() {
  const p = parsedEmlData;
  if (!p) {
    emlText.innerHTML = `<div class="title">${escapeHtml(T('eml_title'))}</div><div class="desc">${escapeHtml(T('eml_desc'))}</div>`;
    emlClearBtn.style.display = 'none';
    return;
  }
  // text + color: signed (blue), unsigned internal (blue), unsigned external / not aligned (red)
  let sels, selCls = 'eml-sel-ok';
  if (p.selectors.length) sels = p.selectors.join(', ');
  else if (p.dkimSigs.length) { sels = T('eml_sig_not_aligned'); selCls = 'eml-sel-crit'; }
  else if (p.internal) { sels = T('eml_nosig_internal'); selCls = 'eml-sel-info'; }
  else { sels = T('eml_nosig'); selCls = 'eml-sel-crit'; }
  emlText.innerHTML = `
    <div class="title">📧 ${escapeHtml(p.file.name)}</div>
    <div class="desc">${escapeHtml(T('eml_detected'))}: <code style="color:var(--accent)">${escapeHtml(p.domain || T('eml_not_detected'))}</code> · ${escapeHtml(T('eml_sels'))}: <code class="${selCls}">${escapeHtml(sels)}</code></div>`;
  emlClearBtn.style.display = '';
}

async function handleEmlFile(file) {
  try {
    if (file.size > 5000000) {
      clearEml();
      setStatus(T('err_eml_big'), true);
      return;
    }
    setStatus('');
    // headers are always at the beginning: the first 256 KB are enough
    const content = await file.slice(0, 262144).text();
    parsedEmlData = { file, ...parseEmlHeaders(content) };

    // The domain of the EML fills the field when it is empty or still holds the
    // value of a previous EML; a domain typed by the user is never overwritten.
    const cur = $('#domain').value.trim().toLowerCase();
    if (parsedEmlData.domain && (!cur || cur === autofilledDomain)) {
      $('#domain').value = parsedEmlData.domain;
      autofilledDomain = parsedEmlData.domain;
    }
    renderEmlBox();
  } catch (err) {
    clearEml();
    setStatus(T('err_eml_parse', err.message), true);
  }
}

/** exact | relaxed | none, same rule as dkim_alignment() in api.php */
function alignOf(d, dom) {
  if (d === dom) return 'exact';
  if (dom.endsWith('.' + d) || d.endsWith('.' + dom)) return 'relaxed';
  return 'none';
}

/**
 * Minimal EML header parsing:
 *  - domain: From header first (5322.From, the one DMARC looks at),
 *            then Sender / Return-Path / Reply-To, then d= of the DKIM signature
 *  - selectors: s= of the DKIM-Signature headers aligned with the domain (ARC excluded)
 */
function parseEmlHeaders(content) {
  // RFC 5322 unfolding: lines starting with whitespace continue the previous header
  const unfolded = content.replace(/\r?\n[ \t]+/g, ' ');
  const headerBlock = unfolded.split(/\r?\n\r?\n/)[0];

  // Address headers are cut to ADDR_MAX chars before the address regexes run:
  // on a huge crafted line they would take quadratic time and freeze the tab.
  const ADDR_MAX = 8000;
  const domainFromAddrLine = (line) => {
    line = line.slice(0, ADDR_MAX);
    let m = line.match(/<([A-Za-z0-9._+\-]+)@([A-Za-z0-9.\-]+)>/);
    if (m) return m[2].toLowerCase();
    m = line.match(/([A-Za-z0-9._+\-]+)@([A-Za-z0-9.\-]+)/);
    if (m) return m[2].toLowerCase();
    return null;
  };

  let domain = null;
  const fromLine = headerBlock.match(/^From:[ \t]*([^\r\n]+)/im);
  if (fromLine) domain = domainFromAddrLine(fromLine[1]);
  if (!domain) {
    for (const h of ['Sender','Return-Path','Reply-To']) {
      const m = headerBlock.match(new RegExp('^'+h+':[ \\t]*([^\\r\\n]+)','im'));
      if (m) { domain = domainFromAddrLine(m[1]); if (domain) break; }
    }
  }
  if (!domain) {
    const dkim = headerBlock.match(/^DKIM-Signature:[^\r\n]*?\bd=([A-Za-z0-9.\-]+)/im);
    if (dkim) domain = dkim[1].toLowerCase();
  }
  if (domain) domain = domain.replace(/[.>;,]+$/,'');
  if (domain && !DOMAIN_RE.test(domain)) domain = null;

  // Only DKIM-Signature identifies the sender's key (<s>._domainkey.<d>).
  // ARC-Message-Signature is added by intermediate servers: shown as info only.
  const parseSig = (body) => {
    const tags = {};
    body.split(';').forEach(kv => {
      const i = kv.indexOf('=');
      if (i < 0) return;
      tags[kv.slice(0, i).trim().toLowerCase()] = kv.slice(i + 1).replace(/\s+/g, '');
    });
    const s = (tags.s || '').replace(/[.>;,]+$/, '');
    const d = (tags.d || '').toLowerCase().replace(/[.>;,]+$/, '');
    if (!SELECTOR_RE.test(s) || !DOMAIN_RE.test(d)) return null;
    return { s, d };
  };
  const dkimSigs = [], arcSigs = [];
  const seen = new Set();
  for (const m of headerBlock.matchAll(/^(DKIM-Signature|ARC-Message-Signature):([^\r\n]+)/gim)) {
    const sig = parseSig(m[2]);
    if (!sig) continue;
    const isDkim = m[1].toLowerCase() === 'dkim-signature';
    const key = (isDkim ? 'k|' : 'a|') + sig.s.toLowerCase() + '|' + sig.d;
    if (seen.has(key)) continue;
    seen.add(key);
    (isDkim ? dkimSigs : arcSigs).push(sig);
  }

  // usable selectors: signatures whose d= is the domain, a subdomain or a parent of it
  const sels = new Set(dkimSigs.filter(x => !domain || alignOf(x.d, domain) !== 'none').map(x => x.s));

  // Internal mail: a single sender domain and every To/Cc recipient in that same domain
  const addrDomains = (name) => {
    const out = new Set();
    for (const m of headerBlock.matchAll(new RegExp('^' + name + ':([^\\r\\n]*)', 'gim'))) {
      for (const a of m[1].slice(0, ADDR_MAX).matchAll(/[A-Za-z0-9._%+\-]+@([A-Za-z0-9.\-]+\.[A-Za-z]{2,})/g)) out.add(a[1].toLowerCase());
    }
    return Array.from(out);
  };
  const fromDoms = addrDomains('From');
  const rcptDoms = [...new Set([...addrDomains('To'), ...addrDomains('Cc')])];
  const internal = fromDoms.length === 1 && rcptDoms.length > 0 && rcptDoms.every(x => x === fromDoms[0]);

  return { domain, selectors: Array.from(sels), dkimSigs, arcSigs, internal };
}

// ---------- Run the analysis ----------
$('#check-form').addEventListener('submit', (e) => { e.preventDefault(); runCheck(); });

async function runCheck() {
  if (running) return;
  const btn = $('#submit-btn');
  const out = $('#result');

  // a domain is needed: typed, or taken from the EML
  let domain = $('#domain').value.trim().toLowerCase();
  if (!domain && parsedEmlData && parsedEmlData.domain) {
    domain = parsedEmlData.domain;
    $('#domain').value = domain;
    autofilledDomain = domain;
  }
  if (!domain) {
    setStatus(T('err_need_domain'), true);
    $('#domain').focus();
    return;
  }

  running = true;
  btn.disabled = true;
  showBusy(T('st_querying'));
  out.innerHTML = '';

  try {
    // Client-side queue: when the server is busy (HTTP 429) the request is
    // not kept open. The page waits the time given by Retry-After and tries
    // again, up to QUEUE_MAX_WAIT seconds in total.
    const queuedSince = Date.now();
    let r, data;
    for (;;) {
      const fd = new FormData();
      fd.append('domain', domain);
      fd.append('resolver', $('#resolver').value.trim() || '1.1.1.1');
      fd.append('lang', LANG);
      const sels = $('#selectors').value.trim();
      if (sels) fd.append('selectors', sels);
      if (fileEl.files[0]) fd.append('eml', fileEl.files[0]);

      r = await fetch('api.php', { method: 'POST', body: fd });
      // The body is read as text first: a proxy error page or a PHP fatal error
      // is not JSON and must produce a readable message, not a parser exception.
      const raw = await r.text();
      data = null;
      try { data = JSON.parse(raw); } catch (e) { /* handled below */ }

      if (r.status !== 429) break;
      const waited = (Date.now() - queuedSince) / 1000;
      if (waited >= QUEUE_MAX_WAIT) throw new Error(T('err_queue_timeout', Math.round(waited)));
      let wait = parseInt(r.headers.get('Retry-After') || '', 10);
      if (!(wait >= 1)) wait = 5;
      wait = Math.min(wait, 15);
      for (let left = wait; left > 0; left--) {
        showBusy(T('st_queued', left));
        await sleep(1000);
      }
      showBusy(T('st_querying'));
    }
    if (data === null || typeof data !== 'object') throw new Error(T('err_bad_response', r.status));
    if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
    lastReportData = data;
    render(data);
    updateAddressBar(data);
  } catch (err) {
    lastReportData = null;
    out.innerHTML = `<div class="error-msg"><strong>${escapeHtml(T('err_prefix'))}</strong> ${escapeHtml(err.message)}</div>`;
  } finally {
    running = false;
    btn.disabled = false;
    setStatus('');
  }
}

// ---------- Shareable link (?domain=...) ----------
/** URL of this instance without query string ('' when the page is not served over http/https). */
function instanceUrl() {
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return '';
  return location.origin + location.pathname.replace(/index\.html$/i, '');
}
/** Link that re-runs the current analysis: domain, plus resolver/selectors when not default. */
function shareUrl(d) {
  const base = instanceUrl();
  if (!base) return '';
  const q = new URLSearchParams();
  q.set('domain', d.domain);
  if (d.resolver && d.resolver !== '1.1.1.1') q.set('resolver', d.resolver);
  const custom = $('#selectors').value.trim().split(/[\s,]+/).filter(x => SELECTOR_RE.test(x));
  if (custom.length) q.set('selectors', custom.join(','));
  return base + '?' + q.toString();
}
function updateAddressBar(d) {
  const u = shareUrl(d);
  if (!u) return;
  try { history.replaceState(null, '', u); } catch (e) { /* not essential */ }
}
/** Reads ?domain= (&resolver= &selectors=) and starts the analysis right away. */
function runFromUrl() {
  const p = new URLSearchParams(location.search);
  const res = (p.get('resolver') || '').trim();
  if (res && RESOLVER_RE.test(res)) $('#resolver').value = res;
  const sels = (p.get('selectors') || '').split(/[\s,]+/).filter(x => SELECTOR_RE.test(x));
  if (sels.length) {
    $('#selectors').value = sels.join(', ');
    $('#adv-panel').classList.add('open');
    renderAdvToggle();
  }
  const dom = (p.get('domain') || '').trim().toLowerCase().replace(/\.$/, '');
  if (!dom) return;
  if (!DOMAIN_RE.test(dom)) { setStatus(T('err_bad_domain', dom.slice(0, 80)), true); return; }
  $('#domain').value = dom;
  runCheck();
}

// ---------- Rendering helpers ----------
function fqdnAttr() { return `title="${escapeHtml(T('fqdn_tip'))}"`; }

function badge(status) {
  const cls = ['ok','warning','critical','info','unknown'].includes(status) ? status : 'unknown';
  return `<span class="badge ${cls}">${escapeHtml(T('b_' + cls))}</span>`;
}

function issueIcon(level) {
  return {critical:'🔴', warning:'⚠️', info:'ℹ️'}[level] || '•';
}
function issueClass(level) {
  return ['critical','warning','info'].includes(level) ? level : 'info';
}

function renderIssues(issues) {
  if (!issues || !issues.length) return '';
  return `<ul class="issue-list">${issues.map(i => `
    <li class="issue ${issueClass(i.level)}">
      <span class="issue-icon">${issueIcon(i.level)}</span>
      <span>${escapeHtml(i.msg)}</span>
    </li>`).join('')}</ul>`;
}

/**
 * Tag list. Tags in longKeys (or longer than 60 chars) get a full-width box,
 * the others a compact chip. Multi-value tags (rua, ruf) are split on commas.
 */
function renderTags(tags, descMap, longKeys = []) {
  if (!tags || !Object.keys(tags).length) return '';

  const shortTags = {};
  const longTags = {};
  for (const [k, v] of Object.entries(tags)) {
    if (longKeys.includes(k.toLowerCase()) || (v && v.length > 60)) longTags[k] = v;
    else shortTags[k] = v;
  }

  let html = '';
  if (Object.keys(shortTags).length) {
    html += `<div class="tag-grid">${Object.entries(shortTags).map(([k,v]) =>
      `<div class="tag-chip" title="${escapeHtml(descMap[k] || '')}">
        <span class="key">${escapeHtml(k)}=</span><span class="val">${escapeHtml(v)}</span>
      </div>`
    ).join('')}</div>`;
  }
  if (Object.keys(longTags).length) {
    html += '<div class="tag-long-list">';
    for (const [k, v] of Object.entries(longTags)) {
      const values = String(v).split(',').map(s => s.trim()).filter(Boolean);
      const countBadge = values.length > 1 ? `<span class="count">${values.length}</span>` : '';
      const desc = descMap[k] || '';
      html += `<div class="tag-long" title="${escapeHtml(desc)}">
        <div class="tag-long-header">
          <span>${escapeHtml(k)}${desc ? ' · ' + escapeHtml(desc) : ''}</span>
          ${countBadge}
        </div>
        <div class="tag-long-body">
          ${values.length ? values.map(val => `<div class="tag-long-value">${escapeHtml(val)}</div>`).join('') : '<div class="tag-long-value">—</div>'}
        </div>
      </div>`;
    }
    html += '</div>';
  }
  return html;
}

const DMARC_LONG = ['rua', 'ruf'];   // always full width (long or multiple values)
const DKIM_LONG  = ['p'];            // the key is always long

function renderDmarc(d) {
  let html = '';

  if (d.managed_by === 'both') {
    html += `<div class="alert-conflict">
      <span class="icon">🚨</span>
      <div>${fmt(S('conflict_html'), [escapeHtml(d.name)])}</div>
    </div>`;
  }

  let mgmt = `<span class="badge unknown">${escapeHtml(T('mg_none'))}</span>`;
  if (d.managed_by === 'cname')      mgmt = `<span class="badge info">${escapeHtml(T('mg_cname'))}</span>`;
  else if (d.managed_by === 'txt')   mgmt = `<span class="badge info">${escapeHtml(T('mg_txt'))}</span>`;
  else if (d.managed_by === 'both')  mgmt = `<span class="badge critical">${escapeHtml(T('mg_both'))}</span>`;

  html += `<dl class="kv">
    <dt>${escapeHtml(T('k_name_queried'))}</dt><dd>${escapeHtml(d.name)}</dd>
    <dt>${escapeHtml(T('k_mgmt'))}</dt><dd>${mgmt}</dd>`;
  if (d.cname && d.cname.length) {
    html += `<dt>${escapeHtml(T('k_cname'))}</dt><dd ${fqdnAttr()}>${d.cname.map(escapeHtml).join(', ')}</dd>`;
  }
  if (d.cname_target) {
    html += `<dt>${escapeHtml(T('k_cname_target'))}</dt><dd ${fqdnAttr()}>${escapeHtml(d.cname_target)}</dd>`;
  }
  html += `</dl>`;

  if (d.records && d.records.length) {
    html += `<div style="margin-top:14px"><label>${escapeHtml(T('lbl_dmarc_records'))}</label>`;
    d.records.forEach(r => {
      html += `<div class="record"><span class="label-inline">TXT</span>${escapeHtml(r)}</div>`;
    });
    html += '</div>';
  }
  if (d.tags && Object.keys(d.tags).length) {
    html += `<div style="margin-top:14px"><label>${escapeHtml(T('lbl_tag_parsing'))}</label>`;
    html += renderTags(d.tags, DESC('dmarc'), DMARC_LONG);
    html += '</div>';
  }
  if (d.issues && d.issues.length) {
    html += `<div style="margin-top:14px"><label>${escapeHtml(T('lbl_analysis'))}</label>` + renderIssues(d.issues) + '</div>';
  }
  return html;
}

function lookupsText(s) {
  return (s.lookups_capped ? '≥ ' : '') + s.lookups + ' / 10';
}

function renderSpf(s) {

    if (s.redirect_chain && s.redirect_chain.length) {
      html += `<div style="margin-top:14px"><label>${escapeHtml(T('lbl_redirect_chain'))}</label>`;
      s.redirect_chain.forEach(c => {

        const to   = escapeHtml(c.to);
        html += `<div class="record" style="border-left:3px solid var(--accent)">
          <span class="label-inline">↪</span>
          <strong>${from}</strong> → redirect= <strong>${to}</strong>
        </div>`;

        } else {
          html += `<div class="record" style="color:var(--crit);border-color:var(--crit)">✗ ${TH('no_spf_on', '<strong>' + to + '</strong>')}</div>`;

    if (s.effective_record && s.effective_domain) {
      html += `<div style="margin-top:10px"><label>${escapeHtml(T('lbl_effective', s.effective_domain))}</label>

    }

      ? `<code>${escapeHtml(s.all_qualifier)}all</code>${s.has_redirect ? ' <span class="hint">' + escapeHtml(T('from_dom', s.effective_domain)) + '</span>' : ''}`
      : escapeHtml(T(s.has_redirect ? 'all_missing_redirect' : 'all_missing'));
    html += `<dl class="kv" style="margin-top:14px">
      <dt>${escapeHtml(T('k_lookups'))}</dt>
      <dd>${escapeHtml(lookupsText(s))} ${s.lookups > 10 ? '🔴' : (s.lookups >= 8 ? '⚠️' : '✅')}</dd>
      ${s.includes && s.includes.length ? `<dt>${escapeHtml(T('k_includes'))}</dt><dd>${s.includes.map(escapeHtml).join(' · ')}</dd>` : ''}
      <dt>${escapeHtml(T('k_mechs_local'))}</dt>
      <dd>${s.mechanisms && s.mechanisms.length ? s.mechanisms.map(escapeHtml).join(' · ') : escapeHtml(T('none_m'))}</dd>
      <dt>${escapeHtml(T('k_all_eff'))}</dt>
      <dd>${allTxt}</dd>
    </dl>`;

    // the effective record can hold dozens of IPs: shown on demand only
    if (s.effective_mechanisms && s.effective_mechanisms.length) {
      html += `<details style="margin-top:10px">
        <summary>${escapeHtml(T('eff_mechs', s.effective_mechanisms.length))}</summary>
        <div class="record" style="margin-top:8px">${s.effective_mechanisms.map(escapeHtml).join(' · ')}</div>
      </details>`;
    }
  }

  if (s.issues && s.issues.length) {
    html += `<div style="margin-top:14px"><label>${escapeHtml(T('lbl_analysis'))}</label>` + renderIssues(s.issues) + '</div>';
  }

  if (s.all_txt && s.all_txt.length) {
    const others = s.all_txt.filter(t => !t.toLowerCase().startsWith('v=spf1'));
    if (others.length) {
      html += `<details><summary>${escapeHtml(T('other_txt', others.length))}</summary>`;
      others.forEach(r => html += `<div class="record">${escapeHtml(r)}</div>`);
      html += '</details>';
    }
  }
  return html;
}

function renderMx(m) {
  let html = '';
  if (m.records && m.records.length) {
    html += `<table class="mx-table">
      <thead><tr><th>${escapeHtml(T('th_priority'))}</th><th>${escapeHtml(T('th_host'))}</th></tr></thead>
      <tbody>${m.records.map(r => `<tr><td>${escapeHtml(r.priority)}</td><td>${escapeHtml(r.host)}</td></tr>`).join('')}</tbody>

/** State of a DKIM key as badge class + label. */
function dkimState(s) {
  const map = {
    active:  ['ok',       'st_active'],
    testing: ['warning',  'st_testing'],
    revoked: ['critical', 'st_revoked'],
    no_key:  ['info',     'st_no_key'],
  };
  const [cls, key] = map[s.state] || map.no_key;
  return { cls, label: T(key) };
}
/** "RSA · 2048 bit" when the size is known. */
function dkimKeyInfo(s) {
  if (!s.key_type || !s.key_bits) return '';
  return T('key_info', String(s.key_type).toUpperCase(), s.key_bits);
}

function renderDkim(d) {
  let html = `<div class="hint" style="margin-bottom:12px">${escapeHtml(T('dkim_summary', d.tried, d.count, d.active_count))}</div>`;

  if (d.count === 0) {
    html += `<div class="issue warning">
      <span class="issue-icon">⚠️</span>
      <span>${escapeHtml(T('dkim_none_found'))}</span>
    </div>`;
  }

  d.found.forEach(s => {
    const st = dkimState(s);
    const info = dkimKeyInfo(s);
    html += `<div class="dkim-selector">
      <h4>🔑 ${escapeHtml(s.selector)} <span class="badge ${st.cls}">${escapeHtml(st.label)}</span>
        <span class="hint" style="font-weight:normal">${escapeHtml(s.name)}${info ? ' · ' + escapeHtml(info) : ''}</span></h4>`;

    if (s.cname && s.cname.length) {
      html += `<div class="record" ${fqdnAttr()}><span class="label-inline">CNAME</span>${s.cname.map(escapeHtml).join(', ')}</div>`;
    }
    (s.txt || []).forEach(t => {
      const preview = t.length > 200 ? escapeHtml(t.slice(0, 200)) + `<span style="color:var(--text-dim)">... (${t.length} char)</span>` : escapeHtml(t);
      html += `<div class="record"><span class="label-inline">TXT</span>${preview}</div>`;
    });
    if (s.tags && Object.keys(s.tags).length) {
      html += renderTags(s.tags, DESC('dkim'), DKIM_LONG);
    }
    if (s.issues && s.issues.length) {
      html += renderIssues(s.issues);
    }
    html += '</div>';
  });

  if (d.issues && d.issues.length) html += renderIssues(d.issues);
  return html;
}

/**
 * Analysis of the uploaded EML: single source for the HTML card and the PDF.
 * Outcomes:
 *   ok       -> DKIM-signed with an aligned d= and an active key in DNS
 *   info     -> not signed but internal mail (normal on M365)
 *   warning  -> signed, but the selector key is not in DNS
 *   critical -> signed with a revoked key, not signed and sent outside,
 *               or signature not aligned
 * Alignment follows the DMARC adkim tag: with adkim=s only an identical
 * domain counts, with the relaxed default a parent/sub domain counts too.
 * Every item has `html` (page) and `text` (PDF, plain text).
 */
function emlAnalysis(d) {
  const e = d.eml;
  if (!e) return null;
  const dom = d.domain;
  const adkim = String((d.dmarc && d.dmarc.tags && d.dmarc.tags.adkim) || 'r').toLowerCase();
  const strict = adkim === 's';
  const found = (d.dkim && d.dkim.found) ? d.dkim.found : [];
  const usable = (f) => f.state === 'active' || f.state === 'testing';
  const keyOf = (x) => found.find(f => f.selector.toLowerCase() === x.s.toLowerCase() && f.domain === x.d);
  const sig = (l) => ({
    t: l.map(x => `${x.s} (d=${x.d})`).join(', '),
    h: l.map(x => `<code>${escapeHtml(x.s)}</code> (d=${escapeHtml(x.d)})`).join(', '),
  });
  const sigs = e.dkim_signatures || [];
  const aligned    = sigs.filter(x => x.alignment === 'exact' || (x.alignment === 'relaxed' && !strict));
  const strictMiss = sigs.filter(x => x.alignment === 'relaxed' && strict);
  const foreign    = sigs.filter(x => !aligned.includes(x));
  const activeKeys = found.filter(usable);

  let status, title, body;
  const notes = [];
  if (aligned.length) {
    const good    = aligned.filter(x => { const k = keyOf(x); return k && usable(k); });
    const revoked = aligned.filter(x => { const k = keyOf(x); return k && k.state === 'revoked'; });
    if (good.length) {
      status = 'ok'; title = T('v_ok_title');
      body = both('v_ok', sig(good));
      if (!good.some(x => x.alignment === 'exact')) {
        notes.push({ level: 'info', ...both('note_relaxed') });
      }
    } else if (revoked.length) {
      status = 'critical'; title = T('v_revoked_title');
      body = both('v_revoked', sig(revoked));
    } else {
      status = 'warning'; title = T('v_missing_title');
      body = both('v_missing', sig(aligned), aligned[0].d);
    }
  } else if (foreign.length) {
    status = 'critical'; title = T('v_foreign_title');
    body = both('v_foreign', sig(foreign), dom);
    if (strictMiss.length) notes.push({ level: 'warning', ...both('v_strict', sig(strictMiss)) });
  } else if (e.internal) {
    status = 'info'; title = T('v_internal_title');
    body = both('v_internal', dom);
  } else {
    status = 'critical'; title = T('v_nosig_title');
    const rc = (e.rcpt_domains || []).filter(x => x !== dom);
    const to = rc.length ? T('rcpt_paren', rc.join(', ')) : '';
    const keys = activeKeys.length
      ? T('keys_present', activeKeys.length, activeKeys.map(f => f.selector).join(', '))
      : T('keys_absent');
    body = both('v_nosig', to, keys);
  }

  // secondary details
  if (aligned.length && foreign.length) {
    notes.push({ level: 'info', ...both('note_other_sigs', sig(foreign)) });
  }
  if (e.arc_signatures && e.arc_signatures.length) {
    notes.push({ level: 'info', ...both('note_arc', sig(e.arc_signatures)) });
  }
  const alLabel = (x) => T(x.alignment === 'exact' ? 'al_exact' : (x.alignment === 'relaxed' ? 'al_relaxed' : 'al_none'));
  const facts = [
    [T('f_sender'), (e.from_domains || []).join(', ') || T('nd')],
    [T('f_rcpt'), (e.rcpt_domains || []).join(', ') || T('nd')],
    [T('f_type'), e.internal ? T('f_type_int') : T('f_type_ext')],
    [T('f_sigs'), sigs.length ? sigs.map(x => `${x.s} (d=${x.d}, ${alLabel(x)})`).join(', ') : T('f_none')],
  ];
  return { status, title, html: body.html, text: body.text, notes, facts };
}

/** Highlighted "Message analysis" card (only when an EML was uploaded). */
function renderEmlCard(d) {
  const a = emlAnalysis(d);
  if (!a) return '';
  const icon = { ok: '✅', info: 'ℹ️', warning: '⚠️', critical: '🔴' }[a.status];
  const badgeHtml = a.status === 'info'
    ? `<span class="badge eml-info">${escapeHtml(T('b_info'))}</span>`
    : badge(a.status);
  let html = `<div class="card eml-card ${a.status}" id="eml-analysis">
    <div class="card-header"><h2>📎 ${escapeHtml(T('eml_card_title'))}</h2>${badgeHtml}</div>
    <div class="card-body">
      <div class="eml-verdict ${a.status}">
        <span class="v-icon">${icon}</span>
        <div><div class="v-title">${escapeHtml(a.title)}</div><div class="v-text">${a.html}</div></div>
      </div>
      <dl class="kv">${a.facts.map(([k, v]) => `<dt>${escapeHtml(k)}</dt><dd>${escapeHtml(v)}</dd>`).join('')}</dl>`;
  if (a.notes.length) {
    html += `<ul class="issue-list" style="margin-top:14px">${a.notes.map(n => `
      <li class="issue ${issueClass(n.level)}"><span class="issue-icon">${issueIcon(n.level)}</span><span>${n.html}</span></li>`).join('')}</ul>`;
  }
  return html + '</div></div>';
}

function overallMsg(status) {
  return T({ ok: 'ov_ok', warning: 'ov_warning', critical: 'ov_critical' }[status] || 'ov_unknown');
}
function statusClass(s) { return ['ok','warning','critical'].includes(s) ? s : 'unknown'; }

function render(d) {
  const out = $('#result');
  const ov = statusClass(d.overall_status);

  let html = `<div id="report-content">`;

  html += `<div class="overall-banner ${ov}">
    <span class="icon">${ {ok:'✅',warning:'⚠️',critical:'🔴'}[ov] || '❔' }</span>
    <div>
      <div style="font-size:16px"><strong>${escapeHtml(d.domain)}</strong></div>
      <div style="color:var(--text-dim); font-size:13px; margin-top:2px">${escapeHtml(overallMsg(ov))}</div>
    </div>
  </div>`;

  html += `<div class="meta-bar">
    <span>${escapeHtml(T('m_resolver'))}: <code>${escapeHtml(d.resolver)}</code></span>
    <span>${escapeHtml(T('m_selectors'))}: <code>${escapeHtml(d.dkim.tried)}</code></span>
    <span>${escapeHtml(T('m_time'))}: <code>${escapeHtml(d.elapsed_ms)}ms</code></span>

  </div>`;

  html += renderEmlCard(d);

  const sections = [
    {key:'mx',    title:'📬 MX',    desc:'sec_mx_desc',    renderer: renderMx},
    {key:'spf',   title:'🛡️ SPF',   desc:'sec_spf_desc',   renderer: renderSpf},
    {key:'dmarc', title:'📋 DMARC', desc:'sec_dmarc_desc', renderer: renderDmarc},
    {key:'dkim',  title:'🔐 DKIM',  desc:'sec_dkim_desc',  renderer: renderDkim},
  ];
  sections.forEach(sec => {
    const data = d[sec.key];
    html += `<div class="card">
      <div class="card-header">
        <h2>${sec.title}</h2>
        ${badge(data.status)}
      </div>
      <div class="card-body">
        <div class="hint" style="margin-bottom:12px">${escapeHtml(T(sec.desc))}</div>
        ${sec.renderer(data)}
      </div>
    </div>`;
  });

  html += `</div>`; // /report-content

  html += `<div class="info-note">
    <span class="info-note-icon">ℹ️</span>
    <div>${S('fqdn_note_html')}</div>
  </div>`;

  // Shareable link: opens the page and runs the same analysis
  const link = shareUrl(d);
  if (link) {
    html += `<div class="pdf-bar share-bar">
      <div>
        <strong>${escapeHtml(T('share_title'))}</strong>
        <div class="hint">${escapeHtml(T('share_hint'))}</div>
      </div>
      <input type="text" id="share-link" readonly value="${escapeHtml(link)}">
      <button type="button" class="secondary" id="share-btn">${escapeHtml(T('share_copy'))}</button>
    </div>`;
  }

  html += `<div class="pdf-bar">
    <div>
      <strong>${escapeHtml(T('pdf_title'))}</strong>
      <div class="hint">${escapeHtml(T('pdf_hint'))}</div>
    </div>
    <button type="button" class="primary" id="pdf-btn">${escapeHtml(T('pdf_btn'))}</button>
  </div>`;

  html += `<details style="margin-top:20px">
    <summary>${escapeHtml(T('json_summary'))}</summary>
    <pre class="record" style="white-space:pre-wrap; max-height:400px; overflow:auto">${escapeHtml(JSON.stringify(d, null, 2))}</pre>
  </details>`;

  out.innerHTML = html;

  $('#pdf-btn').addEventListener('click', generatePdf);
  if (link) {
    $('#share-link').addEventListener('focus', (ev) => ev.target.select());
    $('#share-btn').addEventListener('click', copyShareLink);
  }
}

async function copyShareLink() {
  const input = $('#share-link');
  const btn = $('#share-btn');
  let ok = false;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(input.value);
      ok = true;
    }
  } catch (e) { /* fall back to the selection below */ }
  if (!ok) {
    input.focus();
    input.select();
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  }
  if (ok) {
    btn.textContent = T('share_copied');
    setTimeout(() => { if (btn.isConnected) btn.textContent = T('share_copy'); }, 1800);
  }
}

// ---------- PDF generation (pdfmake) ----------
// pdfmake costruisce il PDF da una definizione strutturata (docDefinition),
// niente rasterizzazione di HTML: layout pulito, testi che vanno a capo
// nativamente, nessun problema di colori CSS, nessuna pagina bianca.

let pdfmakeLoading = null;
function loadPdfmake() {
  if (window.pdfMake && window.pdfMake.vfs) return Promise.resolve();
  if (pdfmakeLoading) return pdfmakeLoading;
  pdfmakeLoading = (async () => {
    // Versione bumped quando aggiorniamo lo script: forza il browser a non
    // riusare un eventuale cached da un path precedente (es. "vendor/")
    await loadScript('include/pdfmake.min.js?v=4');
    await loadScript('include/vfs_fonts.js?v=4');
  })();
  return pdfmakeLoading;
}
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error(T('pdf_load_err', src)));
    document.head.appendChild(s);
  });
}

// palette PDF (chiaro, leggibile in stampa)
const PDF_COLORS = {
  ok:        { bg: '#e7f5ec', border: '#3fb950', text: '#1a7f37' },
  warning:   { bg: '#fff8e1', border: '#d29922', text: '#9a6700' },
  critical:  { bg: '#fdecec', border: '#f85149', text: '#cf222e' },
  info:      { bg: '#f0f6ff', border: '#0969da', text: '#0550ae' },
  neutral:   { bg: '#f6f8fa', border: '#d0d7de', text: '#1f2328' },
  dim:       '#656d76',
  accent:    '#0550ae',
  accent_bg: '#ddf4ff',
};

function pdfStatusLabel(s) {
  return ({ ok: 'OK', warning: 'WARNING', critical: 'CRITICAL', info: 'INFO', unknown: 'N/A' }[s] || s).toUpperCase();
}

// "table" pdfmake con singolo cell colorato (badge / banner)
function pdfBox(text, status, opts = {}) {
  const c = PDF_COLORS[status] || PDF_COLORS.neutral;
  return {
    table: {
      widths: ['*'],
      body: [[ { text, color: c.text, fillColor: c.bg, border: [true,true,true,true], margin: [8, 6, 8, 6], ...opts } ]]
    },
    layout: {
      hLineColor: () => c.border, vLineColor: () => c.border,
      hLineWidth: () => 1, vLineWidth: () => 1,
      paddingLeft: () => 0, paddingRight: () => 0, paddingTop: () => 0, paddingBottom: () => 0,
    },
    margin: [0, 0, 0, 8],
  };
}

function pdfBadge(status) {
  const c = PDF_COLORS[status] || PDF_COLORS.neutral;
  return {
    table: { body: [[ { text: pdfStatusLabel(status), color: c.text, fillColor: c.bg, fontSize: 8, bold: true, margin: [6,2,6,2] } ]] },
    layout: { hLineColor: () => c.border, vLineColor: () => c.border, hLineWidth: () => 0.5, vLineWidth: () => 0.5,
              paddingLeft: () => 0, paddingRight: () => 0, paddingTop: () => 0, paddingBottom: () => 0 },
  };
}

function pdfSectionHeader(title, status) {
  return {
    columns: [
      { text: title, fontSize: 14, bold: true, color: PDF_COLORS.accent },
      { width: 'auto', stack: [ pdfBadge(status) ] },
    ],
    margin: [0, 10, 0, 6],
    columnGap: 10,
  };
}

function pdfIssues(issues) {
  if (!issues || !issues.length) return null;
  return {
    stack: issues.map(i => {
      const c = PDF_COLORS[i.level] || PDF_COLORS.neutral;
      const tag = i.level.toUpperCase();
      return pdfKeep({
        table: { widths: ['*'], body: [[ {
          text: [
            { text: tag + '  ', bold: true, color: c.text, fontSize: 8 },
            { text: pdfSafe(i.msg), color: PDF_COLORS.neutral.text, fontSize: 9 },
          ],
          fillColor: c.bg, margin: [8, 5, 8, 5],
        } ]] },
        layout: {
          hLineWidth: () => 0, vLineWidth: (i) => i === 0 ? 3 : 0,
          vLineColor: () => c.border,
          paddingLeft: () => 0, paddingRight: () => 0, paddingTop: () => 0, paddingBottom: () => 0,
        },
        margin: [0, 0, 0, 4],
      }); // ogni avviso resta intero (se sta in una pagina)
    }),
    margin: [0, 4, 0, 4],
  };
}

function pdfKV(rows) {
  return pdfKeep({
    table: {
      widths: [120, '*'],
      body: rows.map(([k, v]) => [
        { text: k, color: PDF_COLORS.dim, fontSize: 9, margin: [0,3,0,3] },
        { text: v == null || v === '' ? '—' : String(v), fontSize: 9, margin: [0,3,0,3] },
      ]),
    },
    layout: 'noBorders',
    margin: [0, 0, 0, 6],
  });
}

/* ------------------------------------------------------------------
 * Impaginazione PDF: evita blocchi spezzati al cambio pagina.
 * - ogni blocco logico (record, issue, tabella KV, chip, selettore DKIM)
 *   e' marcato `unbreakable`: se non entra nello spazio rimasto, pdfmake
 *   lo sposta intero alla pagina successiva;
 * - titoli ed etichette sono marcati `keepWithNext` (proprieta' nostra):
 *   pdfKeepTogether() li fonde con il blocco seguente in un unico stack
 *   unbreakable, cosi' un titolo non resta mai orfano a fondo pagina;
 * - blocchi stimati piu' alti di una pagina restano spezzabili: pdfmake
 *   scarterebbe il contenuto, vedi PDF_MAX_BLOCK_HEIGHT.
 * ------------------------------------------------------------------ */
/* ATTENZIONE: pdfmake SCARTA in silenzio un blocco unbreakable piu' alto di
 * una pagina. Per questo un blocco viene reso unbreakable solo se la sua
 * altezza stimata (per eccesso) sta ampiamente in una pagina A4.
 * Area utile A4 con i margini del report: 842 - 36 - 50 = 756 pt. */
const PDF_MAX_BLOCK_HEIGHT = 520;   // pt, soglia prudente (~70% della pagina utile)
const PDF_CHARS_PER_LINE   = 85;    // caratteri per riga a piena larghezza, per eccesso

function pdfMarginV(m) {
  if (typeof m === 'number') return 2 * m;
  if (Array.isArray(m)) return m.length === 4 ? m[1] + m[3] : m.length === 2 ? 2 * m[1] : 0;
  return 0;
}

/** Testo "piatto" di un nodo text (stringa, array di run, run annidati). */
function pdfFlatText(t) {
  if (t == null) return '';
  if (typeof t === 'string' || typeof t === 'number') return String(t);
  if (Array.isArray(t)) return t.map(pdfFlatText).join('');
  if (typeof t === 'object') return pdfFlatText(t.text);
  return '';
}

/**
 * Stima per eccesso dell'altezza (pt) di un nodo pdfmake.
 * widthRatio: frazione della larghezza pagina disponibile (colonne).
 */
function pdfEstimateHeight(node, fontSize = 9, widthRatio = 1) {
  if (node == null) return 0;
  if (typeof node === 'string' || typeof node === 'number') {
    const cpl = Math.max(10, Math.floor(PDF_CHARS_PER_LINE * widthRatio * 9 / fontSize));
    const lines = String(node).split('\n').reduce((n, l) => n + Math.max(1, Math.ceil(l.length / cpl)), 0);
    return lines * fontSize * 1.35;
  }
  if (Array.isArray(node)) return node.reduce((n, x) => n + pdfEstimateHeight(x, fontSize, widthRatio), 0);
  if (typeof node !== 'object') return 0;
  const fs = node.fontSize || fontSize;
  let hgt = pdfMarginV(node.margin);
  if (node.stack) hgt += pdfEstimateHeight(node.stack, fs, widthRatio);
  else if (node.columns) {
    const cols = node.columns.length || 1;
    hgt += Math.max(0, ...node.columns.map(c => pdfEstimateHeight(c, fs, widthRatio / cols)));
  } else if (node.table) {
    const rows = node.table.body || [];
    const cols = (rows[0] || []).length || 1;
    hgt += rows.reduce((n, r) => n + 8 + Math.max(0, ...r.map(c => pdfEstimateHeight(c, fs, widthRatio / cols))), 0);
  } else if ('text' in node) {
    hgt += pdfEstimateHeight(pdfFlatText(node.text), fs, widthRatio);
  }
  return hgt;
}

/** True se il nodo sta sicuramente in una pagina (e puo' essere unbreakable). */
function pdfFitsPage(node) { return pdfEstimateHeight(node) <= PDF_MAX_BLOCK_HEIGHT; }

/** Marca un nodo come unbreakable se sta in una pagina, altrimenti lo lascia spezzabile. */
function pdfKeep(node) {
  if (node && typeof node === 'object') {
    if (pdfFitsPage(node)) { if (node.unbreakable === undefined) node.unbreakable = true; }
    else node.unbreakable = false; // troppo alto: deve potersi spezzare
  }
  return node;
}

/** Marca un nodo (titolo/etichetta) da tenere insieme al blocco successivo. */
function pdfKeepWithNext(node) { node.keepWithNext = true; return node; }

/**
 * Fonde ogni nodo `keepWithNext` con il successivo in uno stack unbreakable
 * (catene di piu' titoli consecutivi incluse). Gli altri nodi vengono
 * marcati unbreakable tramite pdfKeep().
 */
function pdfKeepTogether(nodes) {
  const out = [];
  let pending = [];
  for (const n of nodes) {
    if (!n) continue;
    if (n.keepWithNext) { delete n.keepWithNext; pending.push(n); continue; }
    if (pending.length) {
      const group = { stack: [...pending, n] };
      // se il blocco seguente e' troppo grande, teniamo insieme il titolo
      // almeno con l'inizio del blocco: lo stack resta spezzabile
      if (pdfFitsPage(group)) group.unbreakable = true;
      else n.unbreakable = false; // blocco troppo alto: il gruppo resta spezzabile
      out.push(group);
      pending = [];
    } else {
      out.push(pdfKeep(n));
    }
  }
  if (pending.length) out.push({ stack: pending, unbreakable: true });
  return out;
}

/** Sezione completa: titolo legato al primo blocco + blocchi non spezzabili. */
function pdfSection(title, status, blocks) {
  return pdfKeepTogether([pdfKeepWithNext(pdfSectionHeader(title, status)), ...blocks]);
}

function pdfRecordBox(label, text) {
  return pdfKeep({
    table: { widths: ['*'], body: [[ {
      stack: [
        { text: label, color: PDF_COLORS.accent, fontSize: 8, bold: true, margin: [0,0,0,3] },
        { text: softBreak(text), font: 'Roboto', fontSize: 8.5, color: PDF_COLORS.neutral.text },
      ],
      fillColor: PDF_COLORS.neutral.bg, margin: [8, 6, 8, 6],
    } ]] },
    layout: {
      hLineColor: () => PDF_COLORS.neutral.border, vLineColor: () => PDF_COLORS.neutral.border,
      hLineWidth: () => 0.5, vLineWidth: () => 0.5,
      paddingLeft: () => 0, paddingRight: () => 0, paddingTop: () => 0, paddingBottom: () => 0,
    },
    margin: [0, 0, 0, 6],
  });
}

/**
 * pdfmake non spezza le stringhe senza spazi (es. base64 della chiave DKIM,
 * mailto: lunghi, URL). Inserisce uno zero-width-space ogni N caratteri
 * SOLO all'interno di run continui senza whitespace o separatori naturali.
 * Inoltre sanitizza caratteri Unicode che Roboto (font usato nel PDF) non ha
 * nelle proprie tabelle cmap: senza questo, glifi mancanti finiscono nel PDF
 * come "tofu" (rettangolino vuoto o glifo random).
 */
function softBreak(text, chunkSize = 50) {
  if (text == null) return '';
  let s = pdfSafe(String(text));
  return s.replace(/[^\s,;:]{60,}/g, run => {
    const parts = [];
    for (let i = 0; i < run.length; i += chunkSize) parts.push(run.slice(i, i + chunkSize));
    return parts.join('\u200B');
  });
}

/**
 * Map di caratteri Unicode NON presenti nel font Roboto del vfs pdfmake
 * verso equivalenti ASCII. Verificato leggendo la cmap del font:
 * Roboto include Latin-1, Latin Extended, simboli base (·, —, …, •)
 * ma NON include il blocco "Arrows" (U+2190-U+21FF) né molti altri simboli.
 * Aggiungi qui ogni nuovo carattere che dovesse risultare "tofu" nel PDF.
 */
const PDF_CHAR_MAP = {
  '\u2265': '>=',  // ≥ GREATER-THAN OR EQUAL TO
  '\u2192': '>>',  // → RIGHTWARDS ARROW
  '\u2190': '<<',  // ← LEFTWARDS ARROW
  '\u2194': '<>',  // ↔ LEFT RIGHT ARROW
  '\u21AA': '->',  // ↪ LEFTWARDS ARROW WITH HOOK
  '\u21A9': '<-',  // ↩ RIGHTWARDS ARROW WITH HOOK
  '\u279C': '>',   // ➜ HEAVY ROUND-TIPPED RIGHTWARDS ARROW
  '\u2713': 'OK',  // ✓ CHECK MARK
  '\u2717': 'X',   // ✗ BALLOT X
  '\u26A0': '!',   // ⚠ WARNING SIGN
  '\u2705': 'OK',  // ✅ WHITE HEAVY CHECK MARK
  '\u26A1': '!',   // ⚡ HIGH VOLTAGE
  '\u{1F511}': 'KEY', // 🔑
  '\u{1F4E7}': '',  // 📧
  '\u{1F4EC}': '',  // 📬
  '\u{1F6E1}': '',  // 🛡
  '\u{1F4CB}': '',  // 📋
  '\u{1F510}': '',  // 🔐
  '\u{1F534}': '',  // 🔴
  '\u{1F6A8}': '!', // 🚨
  '\u{FE0F}': '',   // variation selector che spesso segue emoji
};
function pdfSafe(s) {
  // Usa replaceAll con Array.from per gestire codepoint > BMP (emoji)
  // Costruisce regex unione dei char da rimpiazzare.
  // Iteriamo per essere certi di catturare anche surrogate pairs.
  return Array.from(s).map(ch => PDF_CHAR_MAP.hasOwnProperty(ch) ? PDF_CHAR_MAP[ch] : ch).join('');
}

// Box per tag DMARC con valori lunghi (rua/ruf), un valore per riga
function pdfLongTag(key, values, desc) {
  return {
    stack: [
      {
        text: [
          { text: key.toUpperCase(), bold: true, color: PDF_COLORS.accent, fontSize: 9 },
          { text: desc ? '  ·  ' + desc : '', color: PDF_COLORS.dim, fontSize: 8 },
          { text: values.length > 1 ? '   (' + values.length + ')' : '', color: PDF_COLORS.dim, fontSize: 8 },
        ],
        fillColor: PDF_COLORS.accent_bg, margin: [8, 4, 8, 4],
      },
      {
        stack: values.map(v => ({ text: softBreak(v), fontSize: 8.5, color: PDF_COLORS.accent, margin: [8, 2, 8, 2] })),
        fillColor: PDF_COLORS.neutral.bg,
      },
    ],
    margin: [0, 0, 0, 5],
    // unbreakable deciso dal blocco contenitore (pdfKeep, in base all'altezza stimata)
  };
}

function pdfTagsGrid(tags, descMap, longKeys = []) {
  if (!tags || !Object.keys(tags).length) return null;
  const shortRows = [];
  const longBoxes = [];
  for (const [k, v] of Object.entries(tags)) {
    if (longKeys.includes(k.toLowerCase()) || (v && v.length > 60)) {
      const values = String(v).split(',').map(s => s.trim()).filter(Boolean);
      longBoxes.push(pdfLongTag(k, values, descMap[k] || ''));
    } else {
      shortRows.push([k, v]);
    }
  }
  const stack = [];
  if (shortRows.length) {
    // 2 colonne di chip
    const cols = [];
    for (let i = 0; i < shortRows.length; i += 2) {
      const r1 = shortRows[i];
      const r2 = shortRows[i+1];
      cols.push({
        columns: [
          chipCell(r1[0], r1[1]),
          r2 ? chipCell(r2[0], r2[1]) : { text: '', width: '*' },
        ],
        columnGap: 6,
        margin: [0, 0, 0, 4],
        unbreakable: true,
      });
    }
    stack.push(...cols);
  }
  stack.push(...longBoxes);
  return { stack, margin: [0, 2, 0, 4] };
}

function chipCell(key, value) {
  return {
    width: '*',
    table: { widths: ['*'], body: [[ {
      text: [
        { text: key + '=', color: PDF_COLORS.dim, fontSize: 8.5 },
        { text: softBreak(String(value)), color: PDF_COLORS.accent, fontSize: 8.5, bold: true },
      ],
      fillColor: PDF_COLORS.neutral.bg, margin: [6, 4, 6, 4],
    } ]] },
    layout: {
      hLineColor: () => PDF_COLORS.neutral.border, vLineColor: () => PDF_COLORS.neutral.border,
      hLineWidth: () => 0.5, vLineWidth: () => 0.5,
      paddingLeft: () => 0, paddingRight: () => 0, paddingTop: () => 0, paddingBottom: () => 0,
    },
  };
}

// ---------- PDF sections ----------
function pdfMxSection(mx) {
  const stack = [];
  if (mx.records && mx.records.length) {
    stack.push({
      table: {
        widths: [60, '*'],
        headerRows: 1,
        body: [
          [ { text: T('th_priority'), bold: true, fontSize: 9, color: PDF_COLORS.dim }, { text: T('th_host'), bold: true, fontSize: 9, color: PDF_COLORS.dim } ],
          ...mx.records.map(r => [ { text: String(r.priority), fontSize: 9 }, { text: softBreak(r.host), fontSize: 9 } ]),
        ],
      },
      layout: {
        hLineWidth: () => 0.3, vLineWidth: () => 0,
        hLineColor: () => PDF_COLORS.neutral.border,
        paddingLeft: () => 4, paddingRight: () => 4, paddingTop: () => 3, paddingBottom: () => 3,
      },
      margin: [0, 0, 0, 6],
    });
  } else if (mx.status !== 'unknown') {
    stack.push({ text: T('pdf_no_mx'), italics: true, color: PDF_COLORS.dim, fontSize: 9 });
  }
  const issues = pdfIssues(mx.issues);
  if (issues) stack.push(issues);
  return stack;
}

function pdfSpfSection(spf) {
  const stack = [];
  if (spf.records && spf.records.length) {
    spf.records.forEach(r => stack.push(pdfRecordBox('TXT', r)));
  } else if (spf.status !== 'unknown') {
    stack.push({ text: T('pdf_no_spf'), italics: true, color: PDF_COLORS.dim, fontSize: 9 });
  }
  if (spf.redirect_chain && spf.redirect_chain.length) {
    stack.push(pdfKeepWithNext({ text: T('lbl_redirect_chain'), bold: true, fontSize: 10, color: PDF_COLORS.dim, margin: [0, 6, 0, 4] }));
    spf.redirect_chain.forEach(c => {
      stack.push(pdfKeepWithNext({
        text: [
          { text: c.from, bold: true }, ' >> redirect= ',
          { text: c.to, bold: true, color: PDF_COLORS.accent },
        ],
        fontSize: 9, margin: [0, 0, 0, 4],
      }));
      if (c.record) stack.push(pdfRecordBox('TXT @ ' + c.to, c.record));
      else stack.push(pdfRecordBox(T('pdf_error_lbl'), T('no_spf_on', c.to)));
    });
  }
  if (spf.effective_record && spf.effective_domain) {
    stack.push(pdfKeepWithNext({ text: T('lbl_effective', spf.effective_domain), bold: true, fontSize: 10, color: PDF_COLORS.dim, margin: [0, 6, 0, 4] }));
    stack.push(pdfRecordBox('TXT', spf.effective_record));
  }
  if (spf.records && spf.records.length) {
    const rows = [[T('k_lookups'), pdfSafe(lookupsText(spf))]];
    if (spf.includes && spf.includes.length) rows.push([T('k_includes'), softBreak(spf.includes.join('  ·  '))]);
    rows.push([T('k_mechs_local'), softBreak((spf.mechanisms || []).join('  ·  ')) || '—']);
    rows.push([T('k_all_eff'), spf.all_qualifier
      ? spf.all_qualifier + 'all' + (spf.has_redirect ? ' ' + T('from_dom', spf.effective_domain) : '')
      : T(spf.has_redirect ? 'all_missing_redirect' : 'all_missing')]);
    stack.push(pdfKV(rows));
  }
  if (spf.effective_mechanisms && spf.effective_mechanisms.length) {
    stack.push(pdfKeepWithNext({ text: T('pdf_eff_mechs', spf.effective_mechanisms.length), bold: true, fontSize: 9, color: PDF_COLORS.dim, margin: [0, 4, 0, 3] }));
    stack.push(pdfRecordBox(T('pdf_mechs_lbl'), spf.effective_mechanisms.join('  ·  ')));
  }
  const issues = pdfIssues(spf.issues);
  if (issues) stack.push(issues);
  return stack;
}

function pdfDmarcSection(dmarc) {
  const stack = [];

  // conflict alert on top
  if (dmarc.managed_by === 'both') {
    stack.push({
      table: { widths: ['*'], body: [[ {
        stack: [
          { text: T('pdf_conflict_title'), bold: true, color: PDF_COLORS.critical.text, fontSize: 11, margin: [0,0,0,4] },
          { text: T('pdf_conflict_body', dmarc.name), fontSize: 9 },
          { text: T('pdf_conflict_action'), fontSize: 9, bold: true, color: PDF_COLORS.critical.text, margin: [0,3,0,0] },
        ],
        fillColor: PDF_COLORS.critical.bg, margin: [10, 8, 10, 8],
      } ]] },
      layout: { hLineColor: () => PDF_COLORS.critical.border, vLineColor: () => PDF_COLORS.critical.border, hLineWidth: () => 1.5, vLineWidth: () => 1.5, paddingLeft: () => 0, paddingRight: () => 0, paddingTop: () => 0, paddingBottom: () => 0 },
      margin: [0, 0, 0, 8],
    });
  }

  const mgmtMap = { cname: T('mg_cname'), txt: T('mg_txt'), both: T('mg_both') };
  const kvRows = [
    [T('k_name_queried'), softBreak(dmarc.name)],
    [T('k_mgmt'), mgmtMap[dmarc.managed_by] || T('mg_none')],
  ];
  if (dmarc.cname && dmarc.cname.length) kvRows.push([T('k_cname'), softBreak(dmarc.cname.join(', '))]);
  if (dmarc.cname_target) kvRows.push([T('k_cname_target'), softBreak(dmarc.cname_target)]);
  stack.push(pdfKV(kvRows));

  if (dmarc.records && dmarc.records.length) {
    dmarc.records.forEach(r => stack.push(pdfRecordBox('TXT', r)));
  }
  if (dmarc.tags && Object.keys(dmarc.tags).length) {
    stack.push(pdfKeepWithNext({ text: T('lbl_tag_parsing'), bold: true, fontSize: 10, color: PDF_COLORS.dim, margin: [0, 6, 0, 4] }));
    const tags = pdfTagsGrid(dmarc.tags, DESC('dmarc'), DMARC_LONG);
    if (tags) stack.push(tags);
  }
  const issues = pdfIssues(dmarc.issues);
  if (issues) stack.push(issues);
  return stack;
}

function pdfDkimSection(dkim) {
  const stack = [];
  stack.push(pdfKeepWithNext({
    text: pdfSafe(T('dkim_summary', dkim.tried, dkim.count, dkim.active_count)),
    color: PDF_COLORS.dim, fontSize: 9, margin: [0, 0, 0, 6],
  }));

  if (dkim.count === 0) {
    const none = pdfIssues([{ level: 'warning', msg: T('pdf_dkim_none') }]);
    if (none) stack.push(none);
  }

  dkim.found.forEach(s => {
    const st = dkimState(s);
    const stColor = (PDF_COLORS[st.cls] || PDF_COLORS.neutral).text;
    const info = dkimKeyInfo(s);
    const inner = [];
    inner.push({
      text: [
        { text: 'KEY ', bold: true, fontSize: 9, color: PDF_COLORS.accent },
        { text: softBreak(s.selector), bold: true, fontSize: 11 },
        { text: '   ' + st.label.toUpperCase(), bold: true, fontSize: 8, color: stColor },
        { text: '   ' + softBreak(s.name) + (info ? '  ·  ' + pdfSafe(info) : ''), color: PDF_COLORS.dim, fontSize: 8 },
      ],
      margin: [0, 0, 0, 4],
    });
    if (s.cname && s.cname.length) inner.push(pdfRecordBox('CNAME', s.cname.join(', ')));
    (s.txt || []).forEach(t => inner.push(pdfRecordBox('TXT', t)));
    if (s.tags && Object.keys(s.tags).length) {
      const tg = pdfTagsGrid(s.tags, DESC('dkim'), DKIM_LONG);
      if (tg) inner.push(tg);
    }
    const sIssues = pdfIssues(s.issues);
    if (sIssues) inner.push(sIssues);

    stack.push(pdfKeep({
      table: { widths: ['*'], body: [[ { stack: inner, margin: [10, 8, 10, 8] } ]] },
      layout: {
        hLineColor: () => PDF_COLORS.neutral.border, vLineColor: () => PDF_COLORS.neutral.border,
        hLineWidth: () => 0.5, vLineWidth: () => 0.5,
        paddingLeft: () => 0, paddingRight: () => 0, paddingTop: () => 0, paddingBottom: () => 0,
      },
      margin: [0, 0, 0, 6],
    }));
  });

  const issues = pdfIssues(dkim.issues);
  if (issues) stack.push(issues);
  return stack;
}

function buildPdfDoc(d) {
  const ov = statusClass(d.overall_status);
  const content = [
    { text: 'Mail DNS Check', fontSize: 18, bold: true, color: PDF_COLORS.accent, margin: [0, 0, 0, 2] },
    { text: T('pdf_subtitle'), color: PDF_COLORS.dim, fontSize: 10, margin: [0, 0, 0, 12] },

    // overall status box
    pdfBox(
      [
        { text: d.domain + '\n', fontSize: 14, bold: true },
        { text: overallMsg(ov), fontSize: 10 },
      ],
      ov === 'unknown' ? 'neutral' : ov
    ),

    // metadata
    {
      columns: [
        { text: [{ text: T('m_resolver') + ': ', color: PDF_COLORS.dim }, d.resolver], fontSize: 8 },
        { text: [{ text: T('m_selectors') + ': ', color: PDF_COLORS.dim }, String(d.dkim.tried)], fontSize: 8 },
        { text: [{ text: T('m_time') + ': ', color: PDF_COLORS.dim }, d.elapsed_ms + ' ms'], fontSize: 8 },
        { text: [{ text: T('m_timestamp') + ': ', color: PDF_COLORS.dim }, d.timestamp], fontSize: 8 },
      ],
      columnGap: 12,
      margin: [0, 0, 0, 10],
    },
  ];

  // EML analysis (when uploaded): same outcome and wording as the on-screen card
  const emlA = emlAnalysis(d);
  if (emlA) {
    content.push(...pdfSection(T('eml_card_title'), emlA.status, [
      pdfBox(
        [ { text: pdfSafe(emlA.title) + '\n', fontSize: 12, bold: true }, { text: softBreak(emlA.text), fontSize: 9 } ],
        emlA.status
      ),
      pdfKV(emlA.facts.map(([k, v]) => [k, softBreak(v)])),
      pdfIssues(emlA.notes.map(n => ({ level: n.level, msg: n.text }))),
    ]));
  }

  content.push(...pdfSection(T('pdf_sec_mx'), d.mx.status, pdfMxSection(d.mx)));
  content.push(...pdfSection(T('pdf_sec_spf'), d.spf.status, pdfSpfSection(d.spf)));
  content.push(...pdfSection(T('pdf_sec_dmarc'), d.dmarc.status, pdfDmarcSection(d.dmarc)));
  content.push(...pdfSection(T('pdf_sec_dkim'), d.dkim.status, pdfDkimSection(d.dkim)));

  // final technical note about the trailing dot of DNS names
  content.push({
    table: { widths: ['*'], body: [[ {
      stack: [
        { text: T('fqdn_note_title'), bold: true, fontSize: 9, color: PDF_COLORS.accent, margin: [0, 0, 0, 3] },
        { text: T('fqdn_note_text'), fontSize: 8.5, color: PDF_COLORS.neutral.text, lineHeight: 1.3 },
      ],
      fillColor: '#f0f6ff', margin: [10, 8, 10, 8],
    } ]] },
    layout: {
      hLineColor: () => PDF_COLORS.accent, vLineColor: () => PDF_COLORS.accent,
      hLineWidth: () => 0.5,
      vLineWidth: (i) => i === 0 ? 3 : 0.5,
      paddingLeft: () => 0, paddingRight: () => 0, paddingTop: () => 0, paddingBottom: () => 0,
    },
    margin: [0, 14, 0, 0],
    unbreakable: true,
  });

  // Footer link: the instance that produced the report (taken from the page
  // address, so every installation shows its own URL), pointing to the same check.
  const site = instanceUrl();
  const siteCell = site
    ? { text: site, link: shareUrl(d) || site, color: PDF_COLORS.accent, fontSize: 8, alignment: 'center' }
    : { text: '', fontSize: 8 };

  return {
    pageSize: 'A4',
    pageMargins: [36, 36, 36, 50],
    defaultStyle: { font: 'Roboto', fontSize: 9, color: PDF_COLORS.neutral.text },
    content,
    footer: (currentPage, pageCount) => ({
      columns: [
        { text: 'Mail DNS Check · ' + d.domain, color: PDF_COLORS.dim, fontSize: 8, alignment: 'left', margin: [36, 0, 0, 0] },
        siteCell,
        { text: T('pdf_page', currentPage, pageCount), color: PDF_COLORS.dim, fontSize: 8, alignment: 'right', margin: [0, 0, 36, 0] },
      ],
      margin: [0, 20, 0, 0],
    }),
  };
}

async function generatePdf() {
  const btn = $('#pdf-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span> ' + escapeHtml(T('pdf_gen'));
  try {
    if (!lastReportData) throw new Error(T('pdf_no_report'));
    await loadPdfmake();
    const docDef = buildPdfDoc(lastReportData);
    const domain = lastReportData.domain || 'report';
    const ts = (lastReportData.timestamp || new Date().toISOString()).replace(/[:T]/g,'-').slice(0,19);
    pdfMake.createPdf(docDef).download(`maildns-${domain}-${ts}.pdf`);
  } catch (err) {
    setStatus(T('pdf_err', err.message), true);
  } finally {
    btn.disabled = false;
    btn.textContent = T('pdf_btn');
  }
}

// ---------- Start ----------
applyStaticI18n();
runFromUrl();
</script>
